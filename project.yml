name: HHiOS
options:
  bundleIdPrefix: com.spudbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "N8W459SD9Z"   # Developer Program team for ade@coleplanet.com (signed in to Xcode)
    CODE_SIGN_STYLE: Automatic

targets:
  HHiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spudbox.hirehaulage
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Hire Haulage
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hire Haulage
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
